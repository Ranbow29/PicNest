[package]
name = "app"
version = "1.1.1"
description = "A Tauri App"
authors = ["Ranbow29"]
license = "GPL-3.0"
repository = "https://github.com/Ranbow29/PicNest"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
getrandom = "0.3.4"
url = "2.5.8"
# 2026-11-15：必须带 custom-protocol，否则 tauri 内部 cfg(dev)=true，
# 裸 cargo build --release 也会去加载 devUrl 127.0.0.1:5173 且不内嵌前端资源。
tauri = { version = "2.12.5", features = ["devtools", "tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
trash = "5.2"
jwalk = "0.8"
rayon = "1.10"
dirs = "6.0"
rfd = "0.15"
psd = "0.3"
flate2 = "1.0"
notify = "7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true


