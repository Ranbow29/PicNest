[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
base64 = "0.22"
# 视觉检索走 reqwest 而不是 curl.exe：Windows 那套 curl 用的是 schannel（系统 TLS），
# Pinterest 会直接断这条握手（schannel: server closed abruptly）。
# 老版 Electron 用的是 Chromium 自带的 BoringSSL + HTTP/2，所以这边必须用 rustls。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls", "socks", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
trash = "5.2"
jwalk = "0.8"
rayon = "1.10"
dirs = "6.0"
rfd = "0.15"
psd = "0.3"
flate2 = "1.0"
notify = "7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

